# Единственный конфиг для lifeweeks.pukikuki.ru.
#
# Заменяет собой ДВА старых файла, которые оба описывали этот домен:
#   /etc/nginx/sites-available/lifeweeks
#   /etc/nginx/sites-available/lifeweeks.pukikuki.ru
# Оба должны быть удалены из sites-enabled — иначе какой из них выиграет,
# зависит от порядка обхода каталога.
#
# Блок `location /n8n/` убран: n8n на сервере нет, порт 5678 теперь занят
# python-бэкендом LifeWeeks, и старый прокси отдавал 502.
#
# Установка:
#   cp lifeweeks.pukikuki.ru.conf /etc/nginx/sites-available/lifeweeks.pukikuki.ru
#   rm -f /etc/nginx/sites-enabled/lifeweeks /etc/nginx/sites-enabled/lifeweeks.pukikuki.ru
#   ln -s /etc/nginx/sites-available/lifeweeks.pukikuki.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lifeweeks.pukikuki.ru;

    # ACME-проверку отдаём с диска, всё остальное — на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lifeweeks.pukikuki.ru;

    ssl_certificate     /etc/letsencrypt/live/lifeweeks.pukikuki.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lifeweeks.pukikuki.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/lifeweeks;
    index index.html;

    access_log /var/log/nginx/lifeweeks.access.log;
    error_log  /var/log/nginx/lifeweeks.error.log;

    # Telegram открывает Mini App во встроенном веб-вью внутри iframe,
    # поэтому X-Frame-Options здесь не ставим — он сломает приложение.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API python-бэкенда --------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5678/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # initData уезжает заголовком — он длинный, буферов по умолчанию мало.
        proxy_buffer_size       8k;
        proxy_buffers        8  8k;

        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # ---- статика Mini App ----------------------------------------------
    # Chart.js версионируется вместе с релизом, поэтому кэшируется надолго.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html не кэшируем: иначе после деплоя у пользователей ещё сутки
    # висит старый фронт с прежним контрактом API.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
